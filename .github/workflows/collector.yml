name: RainSignal Collector

# Polls the Bureau of Meteorology observation products and commits new readings.
#
# GitHub cron is UTC and may be delayed when the service is busy. That is tolerable
# here: storage is keyed on (location, observed_utc) and inserts ignore duplicates,
# so a late or skipped run costs freshness but never completeness.

on:
  schedule:
    # The models read values recorded at 09:00 and 15:00 station-local time, so the
    # collector has to be *there* at those moments -- BoM's feed carries only the
    # current reading and cannot be backfilled.
    #
    # These UTC times cover 09:00 and 15:00 local across all eight timezones the 44
    # stations span, in both standard time and daylight saving:
    #
    #   09:00 local -> 21:00Z (+12 Norfolk DST)  22:00Z (+11)  22:30Z (+10:30 SA DST)
    #                  23:00Z (+10)  23:30Z (+9:30)  01:00Z (+8 Perth)
    #   15:00 local -> 03:00Z (+12)  04:00Z (+11)  04:30Z (+10:30)
    #                  05:00Z (+10)  05:30Z (+9:30)  07:00Z (+8)
    #
    # The previous 3-hourly schedule never landed near either target: Sydney's
    # closest run was 10:20 local, 80 minutes past 9am.
    - cron: "0 21,22,23,1,3,4,5,7 * * *"
    - cron: "30 22,23,4,5 * * *"
    # Late-local sweep so the daytime maximum window (which closes at 21:00 local)
    # is captured after it has closed rather than while it is still running.
    - cron: "0 11,13 * * *"
  workflow_dispatch: {}

concurrency:
  group: rainsignal-collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # A BoM outage costs 7 products x (2 retries + 1) x 45s plus backoff. Without
    # this cap the job would inherit the 360-minute default and one bad night could
    # burn the monthly quota. A healthy run takes about 15 seconds.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # No pip cache: the collector imports only the standard library, so there
          # is nothing to install and nothing to cache.

      - name: Collect observations
        run: python collector/collect.py

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-${{ github.run_id }}
          path: data/live/health.json
          retention-days: 14

      - name: Commit new observations
        if: success()
        run: |
          git config user.name  "Harsh Rastogi"
          git config user.email "S386401@students.cdu.edu.au"
          git add data/live/
          git diff --staged --quiet || git commit -m "data: collector run $(date -u +%FT%TZ)"
          git push
