<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="RainSignal">
  <defs>
    <linearGradient id="rs-cloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ED2FA"/><stop offset="1" stop-color="#3E9BEE"/>
    </linearGradient>
    <linearGradient id="rs-drop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6CC2F7"/><stop offset="1" stop-color="#1D6FD8"/>
    </linearGradient>
    <linearGradient id="rs-land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123A63"/><stop offset="1" stop-color="#0E7C86"/>
    </linearGradient>
  </defs>

  <!-- Australia, drawn from real coastline geometry simplified to 50 points -->
  <g transform="translate(64 34) scale(.60)" fill="url(#rs-land)">
    <path d="M75.9 19.3L80.5 22.7L83.0 33.7L89.2 37.6L100.0 53.4L99.4 68.8L92.1 84.8L82.9 89.3L79.6 86.1L76.1 88.7L68.6 86.5L65.9 81.3L62.3 79.8L62.5 76.4L59.0 78.8L61.5 72.3L56.9 77.8L52.6 71.5L45.2 68.4L32.2 70.4L25.9 75.0L16.5 75.3L11.8 78.3L4.2 75.9L5.9 68.7L0.0 53.5L2.2 54.0L0.1 48.7L2.0 41.4L2.2 43.5L8.5 38.5L18.9 35.7L24.3 26.6L26.4 28.4L25.5 27.1L31.0 20.6L34.5 19.4L40.9 22.6L43.4 15.9L48.3 14.7L46.4 12.4L47.8 12.0L55.2 15.1L58.2 14.0L59.3 15.4L55.7 22.7L67.5 30.2L70.2 26.6L73.3 10.7L75.9 19.3Z"/>
  </g>

  <!-- cloud -->
  <path fill="url(#rs-cloud)" d="M38 72a20 20 0 0 1 2-39.8 27 27 0 0 1 50.4 6.4A17 17 0 0 1 88 72Z"/>

  <!-- rain -->
  <g stroke="#3E9BEE" stroke-width="6.5" stroke-linecap="round" opacity=".95">
    <path d="M27 82 20 96"/><path d="M42 80 35 94"/><path d="M34 96 29 106"/>
  </g>

  <!-- droplet, cut clear of the cloud so both read -->
  <path d="M60 42c14 17 24 29 24 39a24 24 0 0 1-48 0c0-10 10-22 24-39Z"
        fill="url(#rs-drop)" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
  <!-- the signal: three rising bars -->
  <g fill="#fff">
    <rect x="46" y="86" width="8" height="12" rx="2"/>
    <rect x="56" y="79" width="8" height="19" rx="2"/>
    <rect x="66" y="72" width="8" height="26" rx="2"/>
  </g>
</svg>
