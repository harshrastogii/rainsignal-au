<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RainSignal — will it rain tomorrow?</title>
<meta name="description" content="Live Bureau of Meteorology observations and a machine-learning estimate of tomorrow's rain for 44 Australian towns, with how much to trust it in each place.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#eef2f6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.maptiler.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!--
THESIS: One instrument, one question per place: how likely is rain tomorrow here, and
how much should you trust that number in this town. Refuses the weather-app template of
a giant icon and a confident number with no account of its own reliability.
OWN-WORLD: A near-white cartographic ground carrying a real basemap, with frosted glass
instruments floating above it. The map is never covered; it reads through every panel.
One sequential rain ramp, pale to deep, is the only saturated colour on the surface.
Archivo for voice, JetBrains Mono for measurements only.
STORY: See the country, find your town, read the chance, see what it was built from,
then discover by switching the map that the estimate is weakest where rain is rarest.
FIRST VIEWPORT: Full-bleed map. Brand pill top-left, freshness pill top-right, the
readout floating right, map controls and legend bottom-left. Nothing is a card.
FORM: Map-first operating instrument, ranked first of five; the dashboard-of-cards and
the scrolling explainer were the ruts and are refused.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
-->
<a class="skip" href="#panel">Skip to the readout</a>

<div id="map" aria-hidden="true"></div>
<div class="map-veil" aria-hidden="true"></div>

<div class="brand">
  <svg class="brand-glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path d="M12 3.2c3.1 3.6 5 6.4 5 9a5 5 0 0 1-10 0c0-2.6 1.9-5.4 5-9Z"/>
    <path d="M12 12.6v4.9" class="brand-tick"/>
  </svg>
  <span class="brand-name">RainSignal</span>
</div>

<div class="status" id="freshness" data-state="loading">
  <span class="status-dot" aria-hidden="true"></span>
  <span class="status-text" id="freshness-text">Loading observations…</span>
</div>

<div class="controls">
  <div class="switch" role="group" aria-label="What the map shows">
    <button type="button" class="seg" id="mode-rain" aria-pressed="true">Chance of rain</button>
    <button type="button" class="seg" id="mode-trust" aria-pressed="false">How reliable</button>
  </div>
  <figure class="legend">
    <figcaption id="legend-title">Chance of rain tomorrow</figcaption>
    <div class="ramp" id="legend-ramp" aria-hidden="true"></div>
    <div class="ramp-ends"><span id="legend-lo">0%</span><span id="legend-hi">100%</span></div>
    <p class="legend-note" id="legend-note">Hollow means we did not have enough measurements.</p>
  </figure>
</div>

<div class="zoom" role="group" aria-label="Zoom">
  <button type="button" id="zoom-in" aria-label="Zoom in">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 6v12M6 12h12"/></svg>
  </button>
  <button type="button" id="zoom-out" aria-label="Zoom out">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 12h12"/></svg>
  </button>
  <button type="button" id="zoom-reset" aria-label="Show all of Australia">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/>
    </svg>
  </button>
</div>

<section class="panel" id="panel" aria-label="Readout">
  <div class="panel-scroll" id="panel-scroll">

    <div class="pane" id="pane-national">
      <h1 class="lede" id="lede">Will it rain tomorrow?</h1>
      <p class="sub" id="national-sub">Reading the latest measurements…</p>

      <div class="search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>
        </svg>
        <input id="search" type="search" autocomplete="off" spellcheck="false"
               placeholder="Find a town" aria-label="Find a town"
               aria-controls="results" aria-expanded="false" role="combobox">
        <button type="button" class="search-clear" id="search-clear" aria-label="Clear search" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m7 7 10 10M17 7 7 17"/></svg>
        </button>
      </div>
      <ul class="results" id="results" role="listbox" aria-label="Towns"></ul>
    </div>

    <div class="pane" id="pane-station" hidden></div>
  </div>

  <footer class="panel-foot">
    <p>Observations from the <strong>Bureau of Meteorology</strong>. The chance shown comes
    from a student machine-learning model, <strong>not a Bureau forecast</strong>. For
    official warnings go to <a href="https://www.bom.gov.au" target="_blank" rel="noopener">bom.gov.au</a>.</p>
  </footer>
</section>

<div class="tooltip" id="tooltip" role="status" aria-live="polite" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
