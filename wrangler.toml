# RainSignal is a static site: the build is committed under _site/ and served directly.
#
# This project was created in Cloudflare as a Worker with Workers Builds, so its deploy
# command is `npx wrangler deploy`. The previous config declared `pages_build_output_dir`,
# which only Pages reads; wrangler therefore found no Worker entry point and no assets
# directory, and the build failed with "Missing entry-point to Worker script or to assets
# directory".
#
# Declaring the assets directory makes `wrangler deploy` publish _site/ as a static-asset
# Worker. The _headers file inside _site is parsed by Workers and is not itself served.
name = "rainsignal"
compatibility_date = "2026-09-10"

[assets]
directory = "./_site"
# No SPA fallback: RainSignal routes on the hash (#Melbourne), so there are no deep
# paths to rewrite. With the fallback on, every mistyped URL returned the whole app
# with a 200 instead of a 404.
